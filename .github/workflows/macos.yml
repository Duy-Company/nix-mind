name: macOS CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      package_release:
        description: Build universal release packages (no publication without a tag)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test macOS app and package requested releases
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          python3 --version

      - name: Validate release metadata
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' NixMind/Info.plist)
          test "$RELEASE_TAG" = "v$VERSION"
          test -s "release-notes/$RELEASE_TAG.md"
          BUILD_VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' NixMind/Info.plist)
          test "$BUILD_VERSION" = "$VERSION"

      - name: Select build and update mode
        id: mode
        env:
          PACKAGE_RELEASE: ${{ startsWith(github.ref, 'refs/tags/') || inputs.package_release == true }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: |
          UPDATES=$(/usr/libexec/PlistBuddy -c 'Print :NixMindUpdatesEnabled' NixMind/Info.plist)
          echo "updates=$UPDATES" >> "$GITHUB_OUTPUT"
          if [ "$PACKAGE_RELEASE" = true ]; then
            echo 'app=build/release/Build/Products/Release/Nix Mind.app' >> "$GITHUB_OUTPUT"
            echo 'sparkle=build/release/SourcePackages/artifacts/sparkle/Sparkle' >> "$GITHUB_OUTPUT"
          else
            echo 'app=build/ci/Build/Products/Debug/Nix Mind.app' >> "$GITHUB_OUTPUT"
            echo 'sparkle=build/ci/SourcePackages/artifacts/sparkle/Sparkle' >> "$GITHUB_OUTPUT"
          fi
          if [[ "$GITHUB_REF" == refs/tags/* && "$UPDATES" = true && -z "$SPARKLE_PRIVATE_KEY" ]]; then
            echo 'Configure SPARKLE_PRIVATE_KEY before releasing an updater-enabled app.' >&2
            exit 1
          fi

      - name: Run core checks
        run: ./scripts/test.sh

      - name: Run update configuration checks
        run: python3 Tests/UpdateConfigurationTests.py

      - name: Run native editor checks
        run: ./scripts/test-editor.sh

      - name: Run canvas and drag checks
        run: ./scripts/test-canvas.sh

      - name: Run search checks
        run: ./scripts/test-search.sh

      - name: Build Debug for branch checks
        if: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.package_release != true }}
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild -project NixMind.xcodeproj -scheme NixMind -configuration Debug \
            -destination 'platform=macOS' -derivedDataPath build/ci \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tee build/debug-build.log

      - name: Build, sign, and package
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.package_release == true }}
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          set -o pipefail
          mkdir -p build
          ./scripts/build-release.sh 2>&1 | tee build/release-build.log

      - name: Run live MCP checks against the built app
        env:
          APP_PATH: ${{ steps.mode.outputs.app }}
        run: ./scripts/test-mcp-isolated.sh "$APP_PATH"

      - name: Run updater and signing checks
        env:
          APP_PATH: ${{ steps.mode.outputs.app }}
          SPARKLE_PATH: ${{ steps.mode.outputs.sparkle }}
        run: ./scripts/test-updater.sh "$APP_PATH" "$SPARKLE_PATH"

      - name: Sign and verify in-app update feed
        if: ${{ startsWith(github.ref, 'refs/tags/') && steps.mode.outputs.updates == 'true' }}
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: python3 scripts/create-appcast.py

      - name: Upload macOS downloads
        if: ${{ startsWith(github.ref, 'refs/tags/') || inputs.package_release == true }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-universal
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-failure-logs
          path: build/*.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish macOS release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download verified macOS packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: macos-universal
          path: dist

      - name: Verify download checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # A failed upload can be retried without replacing a published download.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Nix Mind $RELEASE_TAG" \
              --notes-file "release-notes/$RELEASE_TAG.md"
          fi
          # Keep incomplete releases as drafts until every asset is present.
          DRAFT=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
          if [ "$DRAFT" = true ]; then
            ASSETS=(dist/*.zip dist/*.dmg dist/SHA256SUMS.txt)
            if [ -f dist/appcast.xml ]; then ASSETS+=(dist/appcast.xml); fi
            gh release upload "$RELEASE_TAG" "${ASSETS[@]}" --clobber
            gh release edit "$RELEASE_TAG" --draft=false --latest
          else
            echo "Release is already published; existing assets are unchanged."
          fi
