name: macOS CI and Release

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: macos-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Test and package universal macOS app
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          python3 --version

      - name: Validate release metadata
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' NixMind/Info.plist)
          test "$RELEASE_TAG" = "v$VERSION"
          test -s "release-notes/$RELEASE_TAG.md"

      - name: Run core checks
        run: ./scripts/test.sh

      - name: Run native editor checks
        run: ./scripts/test-editor.sh

      - name: Run canvas and drag checks
        run: ./scripts/test-canvas.sh

      - name: Build, sign, and package
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: |
          set -o pipefail
          mkdir -p build
          ./scripts/build-release.sh 2>&1 | tee build/release-build.log

      - name: Run live MCP checks against the release app
        run: ./scripts/test-mcp-isolated.sh

      - name: Upload macOS downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-universal
          path: dist/*
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload diagnostic logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-failure-logs
          path: build/*.log
          if-no-files-found: ignore
          retention-days: 7

  release:
    name: Publish macOS release
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out release notes
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download verified macOS packages
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: macos-universal
          path: dist

      - name: Verify download checksums
        working-directory: dist
        run: sha256sum --check SHA256SUMS.txt

      - name: Publish release and assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          # A failed upload can be retried without replacing a published download.
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --draft \
              --title "Nix Mind $RELEASE_TAG" \
              --notes-file "release-notes/$RELEASE_TAG.md"
          fi
          # Keep incomplete releases as drafts until every asset is present.
          DRAFT=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft)
          if [ "$DRAFT" = true ]; then
            gh release upload "$RELEASE_TAG" dist/*.zip dist/*.dmg dist/SHA256SUMS.txt --clobber
            gh release edit "$RELEASE_TAG" --draft=false --latest
          else
            echo "Release is already published; existing assets are unchanged."
          fi
